[package]
name = "rollup_core"
version = "0.1.0"
edition = "2021"
authors = [ "bergabman bergabman1@gmail.com" ]

[dependencies]
actix-web = "4.9.0"
actix-web-actors = "4.3"
tokio = {version = "1", features = ["full"]}
serde = { version = "1.0.209", features = ["derive"] }
serde_json = "1.0.127"
solana-sdk = "2.0.7"
solana-client = "2.0.7"
env_logger = "0.11.5"
log = "0.4.22"
anyhow = "1.0.86"
crossbeam = "0.8.4"
async-channel = "2.3.1"
bincode = "1.3.3"
sha2 = "0.10"
hex = "0.4"
bs58 = "0.5"
dashmap = "6.1"
parking_lot = "0.12"
flate2 = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
governor = "0.6"
jsonwebtoken = "9.0"
blake3 = "1.5"
lru = "0.12"
rayon = "1.10"
num_cpus = "1.16"